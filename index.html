<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/favicon_io/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="./assets/favicon_io/site.webmanifest" />

    <!-- embed font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <!-- reset css -->
    <link rel="stylesheet" href="./assets/css/reset.css" />

    <!-- style css -->
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <header class="header">
      <!-- start nav -->
      <nav class="nav">
        <div class="container">
          <!-- logo -->
          <a href="#!" class="logo">
            <img src="./assets/img/Logo.svg" alt="Logo" />
          </a>

          <!-- menu -->
          <ul class="menu">
            <li class="menu__item">
              <a href="#!" class="menu__link menu__link--active">Home</a>
            </li>
            <li class="menu__item">
              <a href="#!" class="menu__link">About</a>
            </li>
            <li class="menu__item">
              <a href="#!" class="menu__link">Services & Rates</a>
            </li>
            <li class="menu__item">
              <a href="#!" class="menu__link">Reviewa</a>
            </li>
            <li class="menu__item">
              <a href="#!" class="menu__link">Contacts us</a>
            </li>
          </ul>

          <!-- nav__btn -->
          <a href="#!" class="btn nav__btn">Sign up</a>
        </div>
      </nav>
      <!-- end nav -->

      <!-- start hero -->
      <section class="hero">
        <div class="container">
          <!-- hero__media -->
          <div class="hero__media">
            <div class="hero__img hero__img--large">
              <img
                src="./assets/img/hero__img--large.png"
                alt=""
              />
            </div>
            <div class="hero__img hero__img--small">
              <img
                src="./assets/img/hero__img--small.png"
                alt=""
              />
            </div>
          </div>

          <section class="hero__content">
            <h1 class="hero__title">Established & Trusted Pet Care Service</h1>
            <p class="hero__desc">
              Discover a wide variety of Pawsitive services to choose from,
              including daycare, private walks, office duty and spa.
            </p>
            <div class="hero__row">
              <button class="btn hero__btn">Book a Meet</button>
              <a href="#!" class="hero__link">Schedule a Call</a>
            </div>
          </section>
        </div>
      </section>
      <!-- end hero -->
    </header>
  </body>
</html>
